<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f4efe8" />
  <title>管理後台 · 狼人殺</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/admin.css" />
</head>
<body>
  <div class="site-bg"></div>
  <main class="shell admin-shell">
    <header class="brandbar">
      <a href="/" class="brand" aria-label="回首頁"><span><b>狼人殺</b></span></a>
      <div class="brand-actions">
        <select id="languageSelect" class="language-select" aria-label="語言">
          <option value="zh-TW" data-no-translate>繁體中文</option>
          <option value="zh-CN" data-no-translate>简体中文</option>
          <option value="en" data-no-translate>English</option>
        </select>
        <a href="/" class="button button-ghost">回首頁</a>
      </div>
    </header>

    <section id="adminLogin" class="admin-login panel">
      <div class="section-heading"><span class="eyebrow">ADMIN</span><h1>後台登入</h1></div>
      <p>Token 只保留在這個瀏覽器 session，不會寫入房間或網址。</p>
      <form id="adminLoginForm" class="stack-form">
        <label>管理員 Token<input name="token" type="password" autocomplete="current-password" required /></label>
        <button class="button button-primary full" type="submit">登入後台</button>
      </form>
    </section>

    <section id="adminDashboard" class="admin-dashboard hidden">
      <div class="admin-toolbar">
        <div><span class="eyebrow">ADMIN</span><h1>管理後台</h1></div>
        <div class="admin-toolbar-actions"><button id="refreshAdmin" class="button button-secondary" type="button">重新整理</button><button id="logoutAdmin" class="button button-ghost" type="button">登出後台</button></div>
      </div>

      <div class="admin-stats">
        <article class="panel admin-stat"><span>已追蹤房間</span><strong id="adminRoomCount">0</strong></article>
        <article class="panel admin-stat"><span>Google 翻譯</span><strong id="adminTranslationState">—</strong></article>
        <article class="panel admin-stat"><span>最近錯誤</span><strong id="adminErrorCount">0</strong></article>
      </div>

      <div class="admin-grid">
        <section class="panel admin-wide">
          <div class="section-heading compact-heading"><span class="eyebrow">ROOMS</span><h2>所有房間</h2></div>
          <form id="registerRoomForm" class="admin-inline-form">
            <label>註冊既有房間<input name="roomId" maxlength="6" placeholder="KTXPJ3" /></label>
            <button class="button button-ghost" type="submit">加入追蹤</button>
          </form>
          <div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>房號</th><th>首次追蹤</th><th>最後活動</th><th></th></tr></thead><tbody id="adminRoomsBody"></tbody></table></div>
        </section>

        <section class="panel admin-side">
          <div class="section-heading compact-heading"><span class="eyebrow">ROOM</span><h2>房間詳情</h2></div>
          <div id="adminRoomDetail" class="admin-empty">選擇一個房間查看。</div>
        </section>
      </div>

      <section class="panel">
        <div class="section-heading compact-heading"><span class="eyebrow">ERRORS</span><h2>最近錯誤</h2></div>
        <div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>時間</th><th>房號</th><th>錯誤分類</th><th>來源</th><th>訊息</th></tr></thead><tbody id="adminErrorsBody"></tbody></table></div>
      </section>
    </section>
  </main>
  <div id="adminToast" class="toast hidden" role="status"></div>
  <script type="module" src="/admin.js"></script>
</body>
</html>
