<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f4efe8" />
  <title>狼人殺</title>
  <meta name="description" content="Cloudflare Workers 辯論式狼人殺：持久人物登入、完整角色庫、自由聊天、BYOK AI。" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="site-bg"></div>
  <main class="shell">
    <header class="brandbar">
      <a href="/" class="brand" aria-label="回首頁">
        <span><b>狼人殺</b></span>
      </a>
      <div class="brand-actions">
        <span class="mode-chip">只做辯論式</span>
        <button id="leaveButton" class="button button-ghost hidden" type="button">離開此裝置上的登入</button>
      </div>
    </header>

    <section id="landing" class="landing-grid hidden">
      <article class="hero panel">
        <h1>狼人殺</h1>
      </article>

      <div class="entry-stack">
        <form id="createForm" class="panel form-card">
          <div class="section-heading"><span class="eyebrow">CREATE</span><h2>建立房間</h2></div>
          <label>你的名稱<input name="name" maxlength="24" autocomplete="nickname" required placeholder="例如：Ray" /></label>
          <label>人物密碼<input name="playerPassword" minlength="4" maxlength="72" type="password" required autocomplete="new-password" placeholder="至少 4 字元，之後用來找回人物" /></label>
          <label>房間密碼 <span class="optional">選填</span><input name="roomPassword" maxlength="72" type="password" autocomplete="new-password" placeholder="不填代表拿到房號即可進入" /></label>
          <button class="button button-primary full" type="submit">建立辯論房</button>
        </form>

        <form id="goRoomForm" class="panel form-card compact-card">
          <div class="section-heading"><span class="eyebrow">JOIN</span><h2>前往房間</h2></div>
          <label>房號<input name="roomId" maxlength="6" required autocapitalize="characters" placeholder="例如：2U64RJ" /></label>
          <button class="button button-secondary full" type="submit">開啟 /房號</button>
        </form>
      </div>
    </section>

    <section id="roomGate" class="gate-wrap hidden">
      <article class="panel gate-card">
        <div class="gate-code"><span>ROOM</span><strong id="gateRoomCode">------</strong></div>
        <h1>進入房間</h1>
        <p id="gateHint">建立新人物，或用名稱＋人物密碼找回原本身份。</p>
        <div id="roomPasswordNotice" class="notice hidden">這個房間有設定房間密碼；建立人物與重新登入都必須先通過房間密碼。</div>
        <div class="auth-grid">
          <form id="joinForm" class="auth-box">
            <h2>建立新人物</h2>
            <label>玩家名稱<input name="name" maxlength="24" autocomplete="nickname" required placeholder="同房不可重名" /></label>
            <label>人物密碼<input name="playerPassword" minlength="4" maxlength="72" type="password" required autocomplete="new-password" placeholder="至少 4 字元" /></label>
            <label class="room-password-field">房間密碼<input name="roomPassword" maxlength="72" type="password" autocomplete="current-password" /></label>
            <button class="button button-primary full" type="submit">建立並加入</button>
          </form>
          <form id="loginForm" class="auth-box">
            <h2>回到原有人物</h2>
            <label>玩家名稱<input name="name" maxlength="24" autocomplete="username" required placeholder="原本的名稱" /></label>
            <label>人物密碼<input name="playerPassword" maxlength="72" type="password" required autocomplete="current-password" /></label>
            <label class="room-password-field">房間密碼<input name="roomPassword" maxlength="72" type="password" autocomplete="current-password" /></label>
            <button class="button button-secondary full" type="submit">重新登入人物</button>
          </form>
        </div>
      </article>
    </section>

    <section id="game" class="game hidden">
      <section class="panel room-banner">
        <div class="room-identity"><span class="eyebrow">ROOM</span><div class="room-code-row"><strong id="roomCode">------</strong><button id="copyRoom" class="icon-button" type="button">複製連結</button></div></div>
        <div class="room-stat"><span>階段</span><strong id="phaseLabel">大廳</strong></div>
        <div class="room-stat"><span>輪次</span><strong id="roundLabel">等待開始</strong></div>
        <div class="room-stat role-stat"><span>你的身份</span><strong id="roleLabel">尚未分配</strong></div>
        <div class="room-stat"><span>陣營</span><strong id="factionLabel">—</strong></div>
      </section>

      <div id="noticePanel" class="notice hidden"></div>

      <div class="game-grid">
        <div class="main-column">
          <section class="panel action-card">
            <div class="section-heading compact-heading"><span class="eyebrow">ACTION</span><h2>本階段操作</h2></div>
            <div id="actionArea" class="action-area"></div>
          </section>

          <section class="panel chat-card">
            <div class="section-heading compact-heading chat-heading"><div><span class="eyebrow">PUBLIC CHAT</span><h2>公開聊天室與正式紀錄</h2></div><span id="chatStatus" class="status-dot">可聊天</span></div>
            <div id="messages" class="messages" aria-live="polite"></div>
            <form id="chatForm" class="chat-form">
              <input id="chatInput" maxlength="500" autocomplete="off" placeholder="自由聊天不等於正式發言……" />
              <button class="button button-secondary" type="submit">送出</button>
            </form>
          </section>
        </div>

        <aside class="side-column">
          <section class="panel players-card">
            <div class="section-heading compact-heading"><span class="eyebrow">PLAYERS</span><h2>房內人物</h2></div>
            <div id="players" class="players"></div>
          </section>

          <section id="hostPanel" class="panel host-card hidden">
            <div class="section-heading compact-heading"><span class="eyebrow">HOST</span><h2>房主管理</h2></div>

            <details open>
              <summary>遊戲房規</summary>
              <form id="settingsForm" class="stack-form">
                <label class="check-row"><input name="sheriffEnabled" type="checkbox" /> 啟用警長選舉</label>
                <label>死亡資訊<select name="deathInfo"><option value="hidden">完全隱藏</option><option value="names">顯示死者、隱藏死因</option><option value="full">顯示死者與死因</option></select></label>
                <label>平票處理<select name="tieRule"><option value="no_elimination">平票無人出局</option><option value="revote">全場重投</option><option value="pk_revote">平票玩家 PK 後重投</option></select></label>
                <button class="button button-ghost full" type="submit">套用房規</button>
              </form>
            </details>

            <details open>
              <summary>角色配置 <span id="roleSetupTotal" class="summary-count">0 / 0</span></summary>
              <div class="role-tools"><input id="roleSearch" placeholder="搜尋角色、陣營或技能……" /><button id="zeroRoles" class="icon-button" type="button">全部歸零</button></div>
              <form id="roleSetupForm">
                <div id="roleCatalog" class="role-catalog"></div>
                <button class="button button-secondary full" type="submit">套用角色配置</button>
              </form>
              <p id="roleSetupError" class="form-error hidden"></p>
            </details>

            <details>
              <summary>選用 AI（BYOK）</summary>
              <form id="addAIForm" class="stack-form">
                <label>AI 名稱<input name="name" maxlength="24" required placeholder="例如：Gemini 7號" /></label>
                <label>Provider<select name="provider" id="aiProvider"><option value="openai">OpenAI GPT</option><option value="gemini">Google Gemini</option><option value="deepseek">DeepSeek</option><option value="openai-compatible">OpenAI-compatible</option></select></label>
                <label>Model<input name="model" id="aiModel" required value="gpt-5.6-luna" /></label>
                <label id="aiBaseUrlRow" class="hidden">Base URL<input name="baseUrl" placeholder="https://provider.example/v1" /></label>
                <label>API Key <span class="optional">只存此瀏覽器 session</span><input name="apiKey" type="password" autocomplete="off" required placeholder="不會寫入房間資料" /></label>
                <button class="button button-secondary full" type="submit">加入 AI 玩家</button>
              </form>
              <div id="pendingAIBox" class="pending-ai hidden"></div>
            </details>

            <div class="host-actions"><button id="startButton" class="button button-primary full" type="button">開始遊戲</button><button id="resetButton" class="button button-ghost full hidden" type="button">回大廳／下一局</button></div>
          </section>
        </aside>
      </div>
    </section>
  </main>

  <div id="toast" class="toast hidden" role="status"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
