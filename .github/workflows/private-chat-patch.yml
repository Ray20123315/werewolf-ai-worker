name: private-chat-patch

on:
  push:
    branches: [main]
    paths: [.github/workflows/private-chat-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply exact private chat patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}: {old[:120]!r}")
              p.write_text(s.replace(old, new, 1))

          Path("src/chat.ts").write_text(r'''import { playerFaction } from "./game-engine.js";
          import type { ChatChannel, ChatMessage, GameState, Player } from "./types.js";

          export function normalizeChatChannel(channel: unknown): ChatChannel {
            if (channel === undefined || channel === "public") return "public";
            if (channel === "werewolf" || channel === "lovers") return channel;
            throw new Error("聊天頻道無效");
          }

          export function canSendChatChannel(state: GameState, actor: Player, channel: ChatChannel): boolean {
            if (actor.kickedAt) return false;
            if (channel === "public") {
              if (state.phase === "night") return false;
              if ((actor.isSpectator || !actor.alive) && state.phase !== "lobby" && state.phase !== "ended") return false;
              return true;
            }
            if (state.phase === "lobby" || state.phase === "ended" || actor.isSpectator || !actor.alive) return false;
            if (channel === "werewolf") return playerFaction(actor) === "werewolf";
            return reciprocalLivingLoverId(state, actor) !== undefined;
          }

          export function privateChatAudienceIds(state: GameState, actor: Player, channel: Exclude<ChatChannel, "public">): string[] {
            if (!canSendChatChannel(state, actor, channel)) return [];
            if (channel === "werewolf") {
              return state.players
                .filter((player) => !player.kickedAt && !player.isSpectator && player.alive && playerFaction(player) === "werewolf")
                .map((player) => player.id);
            }
            const loverId = reciprocalLivingLoverId(state, actor);
            return loverId ? [actor.id, loverId] : [];
          }

          export function availableChatChannels(state: GameState, actor: Player): ChatChannel[] {
            return (["public", "werewolf", "lovers"] as const).filter((channel) => canSendChatChannel(state, actor, channel));
          }

          export function canViewChatMessage(viewer: Player, message: ChatMessage): boolean {
            const channel = message.channel ?? "public";
            if (channel === "public") return true;
            return Array.isArray(message.audienceIds) && message.audienceIds.includes(viewer.id);
          }

          function reciprocalLivingLoverId(state: GameState, actor: Player): string | undefined {
            const loverId = state.roleMemory[actor.id]?.lover;
            if (typeof loverId !== "string") return undefined;
            const lover = state.players.find((player) => player.id === loverId && !player.kickedAt && !player.isSpectator && player.alive);
            if (!lover || state.roleMemory[lover.id]?.lover !== actor.id) return undefined;
            return lover.id;
          }
          ''')

          replace_once("src/types.ts",
            'export type AppLocale = "zh-TW" | "zh-CN" | "en";\n',
            'export type AppLocale = "zh-TW" | "zh-CN" | "en";\nexport type ChatChannel = "public" | "werewolf" | "lovers";\n')
          replace_once("src/types.ts",
            '  sourceLocale?: AppLocale;\n  kind: "chat" | "speech" | "system" | "role";\n',
            '  sourceLocale?: AppLocale;\n  channel?: ChatChannel;\n  audienceIds?: string[];\n  kind: "chat" | "speech" | "system" | "role";\n')
          replace_once("src/types.ts",
            '  messages: ChatMessage[];\n  me: {\n',
            '  messages: ChatMessage[];\n  chatChannels: ChatChannel[];\n  me: {\n')
          replace_once("src/types.ts",
            '  | { type: "chat"; content: string; locale?: AppLocale }\n',
            '  | { type: "chat"; content: string; locale?: AppLocale; channel?: ChatChannel }\n')

          replace_once("src/room.ts",
            'import { createPasswordVerifier, normalizePlayerName, verifyPassword } from "./auth";\n',
            'import { createPasswordVerifier, normalizePlayerName, verifyPassword } from "./auth";\nimport { availableChatChannels, canSendChatChannel, canViewChatMessage, normalizeChatChannel, privateChatAudienceIds } from "./chat";\n')
          replace_once("src/room.ts",
            '  ChatMessage,\n  ClientMessage,\n',
            '  ChatChannel,\n  ChatMessage,\n  ClientMessage,\n')
          replace_once("src/room.ts",
            '      case "chat": return this.sendChat(token, command.content, command.locale);\n',
            '      case "chat": return this.sendChat(token, command.content, command.locale, command.channel);\n')
          replace_once("src/room.ts",
            '''  private sendChat(token: string, content: string, locale?: AppLocale): void {
    const state = this.requireState();
    const actor = this.playerByToken(state, token);
    if (state.phase === "night") throw new Error("夜晚為秘密行動階段，公開聊天室暫停");
    if (actor.isSpectator && state.phase !== "lobby" && state.phase !== "ended") throw new Error("觀戰者在進行中的對局不能向存活玩家發言");
    state.messages.push(this.chatMessage(state, actor, this.normalizeChat(content), this.normalizeMessageLocale(locale)));
    this.trimMessages(state);
    this.saveBroadcast(state);
  }
''',
            '''  private sendChat(token: string, content: string, locale?: AppLocale, rawChannel?: ChatChannel): void {
    const state = this.requireState();
    const actor = this.playerByToken(state, token);
    const channel = normalizeChatChannel(rawChannel);
    if (!canSendChatChannel(state, actor, channel)) {
      if (channel === "public" && state.phase === "night") throw new Error("夜晚公開聊天室暫停；若你有狼人或情侶私聊權限可切換頻道");
      if (channel === "werewolf") throw new Error("只有目前存活的狼人陣營玩家可使用狼人私聊");
      if (channel === "lovers") throw new Error("只有目前存活且互相綁定的情侶可使用情侶私聊");
      throw new Error("本階段不可聊天");
    }
    const message = this.chatMessage(state, actor, this.normalizeChat(content), this.normalizeMessageLocale(locale));
    if (channel !== "public") {
      message.channel = channel;
      message.audienceIds = privateChatAudienceIds(state, actor, channel);
      if (!message.audienceIds.includes(actor.id)) throw new Error("聊天頻道權限已變更，請重新整理狀態");
    }
    state.messages.push(message);
    this.trimMessages(state);
    this.saveBroadcast(state);
  }
''')
          replace_once("src/room.ts",
            '    const logs = state.messages.slice(-40).map((m) => `${m.playerName}: ${m.content}`).join("\\\n");\n',
            '    const logs = state.messages.filter((m) => (m.channel ?? "public") === "public").slice(-40).map((m) => `${m.playerName}: ${m.content}`).join("\\\n");\n')
          replace_once("src/room.ts",
            '      messages: state.messages, me: privateMe, ...(prompt ? { roleAction: prompt } : {}), roleActionSubmitted: Boolean(state.nightActions.roleActions[me.id]), canSubmitWolfVote: this.participatesWolfVote(state, me), wolfVoteSubmitted: Boolean(state.nightActions.wolfVotes[me.id]), votesCast: Object.keys(state.votes),\n',
            '      messages: state.messages.filter((message) => canViewChatMessage(me, message)), chatChannels: availableChatChannels(state, me), me: privateMe, ...(prompt ? { roleAction: prompt } : {}), roleActionSubmitted: Boolean(state.nightActions.roleActions[me.id]), canSubmitWolfVote: this.participatesWolfVote(state, me), wolfVoteSubmitted: Boolean(state.nightActions.wolfVotes[me.id]), votesCast: Object.keys(state.votes),\n')

          replace_once("public/index.html",
            '<div class="section-heading compact-heading chat-heading"><div><span class="eyebrow">PUBLIC CHAT</span><h2>公開聊天室與正式紀錄</h2></div><span id="chatStatus" class="status-dot">可聊天</span></div>',
            '<div class="section-heading compact-heading chat-heading"><div><span class="eyebrow">CHAT</span><h2>聊天頻道與正式紀錄</h2></div><span id="chatStatus" class="status-dot">可聊天</span></div>')
          replace_once("public/index.html",
            '''            <form id="chatForm" class="chat-form">
              <input id="chatInput" maxlength="500" autocomplete="off" placeholder="自由聊天不等於正式發言……" />
              <button class="button button-secondary" type="submit">送出</button>
            </form>''',
            '''            <form id="chatForm" class="chat-form">
              <select id="chatChannel" class="chat-channel-select" aria-label="聊天頻道"></select>
              <input id="chatInput" maxlength="500" autocomplete="off" placeholder="自由聊天不等於正式發言……" />
              <button class="button button-secondary" type="submit">送出</button>
            </form>''')

          replace_once("public/app.js",
            'const factionOrder = ["village", "werewolf", "spirit", "blood", "neutral"];\n',
            'const factionOrder = ["village", "werewolf", "spirit", "blood", "neutral"];\nconst chatChannelLabels = { public: "公開聊天", werewolf: "狼人私聊", lovers: "情侶私聊" };\n')
          replace_once("public/app.js",
            '''$("#chatForm").addEventListener("submit", (event) => {
  event.preventDefault();
  const input = $("#chatInput");
  const content = input.value.trim();
  if (!content) return;
  send({ type: "chat", content, locale: getLocale() });
  input.value = "";
});''',
            '''$("#chatForm").addEventListener("submit", (event) => {
  event.preventDefault();
  const input = $("#chatInput");
  const channel = $("#chatChannel")?.value || "public";
  const content = input.value.trim();
  if (!content) return;
  send({ type: "chat", content, locale: getLocale(), channel });
  input.value = "";
});
$("#chatChannel")?.addEventListener("change", renderChatState);''')
          replace_once("public/app.js",
            '''$("#addAIForm").addEventListener("submit", async (event) => {
  event.preventDefault();
  if (!session || !roomId) return;
  const form = new FormData(event.currentTarget);''',
            '''$("#addAIForm").addEventListener("submit", async (event) => {
  event.preventDefault();
  if (!session || !roomId) return;
  const formElement = event.currentTarget;
  const form = new FormData(formElement);''')
          replace_once("public/app.js", '    event.currentTarget.reset();\n', '    formElement.reset();\n')
          replace_once("public/app.js",
            '''    const shownName = m.kind === "system" ? knownText("系統") : m.playerName;
    return `<article class="message message-${m.kind}" data-no-translate><div class="message-head"><strong>${escapeHtml(shownName)}</strong><span>${formatTime(m.createdAt)}</span></div><p class="message-content" title="${escapeAttr(content)}">${escapeHtml(content)}</p></article>`;''',
            '''    const shownName = m.kind === "system" ? knownText("系統") : m.playerName;
    const channel = m.channel || "public";
    const channelBadge = channel === "public" ? "" : `<span class="message-channel channel-${channel}">${escapeHtml(knownText(chatChannelLabels[channel] || channel))}</span>`;
    return `<article class="message message-${m.kind} message-channel-${channel}" data-no-translate><div class="message-head"><div class="message-author"><strong>${escapeHtml(shownName)}</strong>${channelBadge}</div><span>${formatTime(m.createdAt)}</span></div><p class="message-content" title="${escapeAttr(content)}">${escapeHtml(content)}</p></article>`;''')
          replace_once("public/app.js",
            '  if (state.phase === "night") notices.push("夜晚公開聊天室已暫停，避免資訊洩漏。 ");\n',
            '  if (state.phase === "night") notices.push("夜晚公開聊天室已暫停；有權限的狼人／情侶仍可使用私聊。 ");\n')
          replace_once("public/app.js",
            '''function renderChatState() {
  const blocked = state.phase === "night" || (state.me.isSpectator && !["lobby", "ended"].includes(state.phase)) || (!state.me.alive && !["lobby", "ended"].includes(state.phase));
  $("#chatInput").disabled = blocked;
  $("#chatForm").querySelector("button").disabled = blocked;
  $("#chatStatus").textContent = blocked ? "本階段不可聊天" : "可自由聊天";
  $("#chatStatus").classList.toggle("blocked", blocked);
}''',
            '''function renderChatState() {
  const select = $("#chatChannel");
  const previous = select?.value;
  const channels = Array.isArray(state.chatChannels) ? state.chatChannels : (state.phase === "night" ? [] : ["public"]);
  if (select) {
    select.innerHTML = channels.map((channel) => `<option value="${channel}">${escapeHtml(knownText(chatChannelLabels[channel] || channel))}</option>`).join("");
    if (previous && channels.includes(previous)) select.value = previous;
    select.disabled = channels.length === 0;
  }
  const blocked = channels.length === 0;
  const activeChannel = select?.value || channels[0] || "public";
  $("#chatInput").disabled = blocked;
  $("#chatForm").querySelector("button").disabled = blocked;
  $("#chatStatus").textContent = blocked ? knownText("本階段不可聊天") : `${knownText(chatChannelLabels[activeChannel] || activeChannel)} · ${knownText("可自由聊天")}`;
  $("#chatStatus").classList.toggle("blocked", blocked);
  if (!blocked) {
    $("#chatInput").placeholder = activeChannel === "werewolf"
      ? knownText("狼人私聊只有目前存活狼人能看到。")
      : activeChannel === "lovers"
        ? knownText("情侶私聊只有目前這對情侶能看到。")
        : knownText("自由聊天不等於正式發言……");
  }
}''')

          replace_once("public/i18n.js",
            '  "PUBLIC CHAT": { "zh-TW": "公開聊天", "zh-CN": "公开聊天", en: "PUBLIC CHAT" },\n  "公開聊天室與正式紀錄": { "zh-TW": "公開聊天室與正式紀錄", "zh-CN": "公开聊天室与正式记录", en: "Public chat and formal record" },\n',
            '  "PUBLIC CHAT": { "zh-TW": "公開聊天", "zh-CN": "公开聊天", en: "PUBLIC CHAT" },\n  "CHAT": { "zh-TW": "聊天", "zh-CN": "聊天", en: "CHAT" },\n  "聊天頻道與正式紀錄": { "zh-TW": "聊天頻道與正式紀錄", "zh-CN": "聊天频道与正式记录", en: "Chat channels and formal record" },\n  "聊天頻道": { "zh-TW": "聊天頻道", "zh-CN": "聊天频道", en: "Chat channel" },\n  "公開聊天": { "zh-TW": "公開聊天", "zh-CN": "公开聊天", en: "Public chat" },\n  "狼人私聊": { "zh-TW": "狼人私聊", "zh-CN": "狼人私聊", en: "Werewolf chat" },\n  "情侶私聊": { "zh-TW": "情侶私聊", "zh-CN": "情侣私聊", en: "Lovers chat" },\n  "狼人私聊只有目前存活狼人能看到。": { "zh-TW": "狼人私聊只有目前存活狼人能看到。", "zh-CN": "狼人私聊只有当前存活狼人能看到。", en: "Only currently living werewolves can see this chat." },\n  "情侶私聊只有目前這對情侶能看到。": { "zh-TW": "情侶私聊只有目前這對情侶能看到。", "zh-CN": "情侣私聊只有当前这对情侣能看到。", en: "Only the current lovers pair can see this chat." },\n  "夜晚公開聊天室已暫停；有權限的狼人／情侶仍可使用私聊。": { "zh-TW": "夜晚公開聊天室已暫停；有權限的狼人／情侶仍可使用私聊。", "zh-CN": "夜晚公开聊天室已暂停；有权限的狼人／情侣仍可使用私聊。", en: "Public chat is paused at night; eligible werewolves and lovers can still use private chat." },\n  "公開聊天室與正式紀錄": { "zh-TW": "公開聊天室與正式紀錄", "zh-CN": "公开聊天室与正式记录", en: "Public chat and formal record" },\n')

          replace_once("public/styles.css",
            '.message-head { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 5px; }\n.message-head strong { font-size: 12px; }\n',
            '.message-head { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 5px; }\n.message-author { display: flex; align-items: center; gap: 7px; min-width: 0; }\n.message-head strong { font-size: 12px; }\n.message-channel { padding: 2px 6px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); background: var(--paper-2); font-size: 9px; font-weight: 750; }\n.channel-werewolf { color: #7a2f2b; border-color: #dfbbb6; background: #fff1ef; }\n.channel-lovers { color: #7d4560; border-color: #e0bfd0; background: #fff3f8; }\n')
          replace_once("public/styles.css",
            '.chat-form { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); }\n',
            '.chat-form { display: grid; grid-template-columns: minmax(120px,.34fr) minmax(0,1fr) auto; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); }\n.chat-channel-select { min-width: 120px; }\n')

          replace_once("test/game-engine.test.mjs",
            '} from "../.test-build/game-engine.js";\n',
            '} from "../.test-build/game-engine.js";\nimport { availableChatChannels, canSendChatChannel, canViewChatMessage, normalizeChatChannel, privateChatAudienceIds } from "../.test-build/chat.js";\n')
          with Path("test/game-engine.test.mjs").open("a") as f:
              f.write(r'''

          test("werewolf private chat is server-authorized and snapshots its audience", () => {
            const wolfA = p("wa", "werewolf");
            const wolfB = p("wb", "black_wolf_king");
            const villager = p("v", "villager");
            const state = baseState([wolfA, wolfB, villager]);
            state.phase = "night";
            assert.deepEqual(availableChatChannels(state, wolfA), ["werewolf"]);
            assert.equal(canSendChatChannel(state, villager, "werewolf"), false);
            assert.equal(canSendChatChannel(state, wolfA, "public"), false);
            const audienceIds = privateChatAudienceIds(state, wolfA, "werewolf");
            assert.deepEqual(new Set(audienceIds), new Set(["wa", "wb"]));
            const message = { id: "m", playerId: "wa", playerName: "wa", content: "secret", channel: "werewolf", audienceIds, kind: "chat", createdAt: 0, round: 1, phase: "night" };
            assert.equal(canViewChatMessage(wolfA, message), true);
            assert.equal(canViewChatMessage(villager, message), false);
            villager.factionOverride = "werewolf";
            assert.equal(canViewChatMessage(villager, message), false, "later conversion must not reveal earlier wolf chat");
          });

          test("lovers private chat requires a reciprocal living relationship", () => {
            const a = p("a", "villager");
            const b = p("b", "seer");
            const c = p("c", "werewolf");
            const state = baseState([a, b, c]);
            state.phase = "debate";
            state.roleMemory = { a: { lover: "b" }, b: { lover: "a" } };
            assert.deepEqual(availableChatChannels(state, a), ["public", "lovers"]);
            assert.deepEqual(new Set(privateChatAudienceIds(state, a, "lovers")), new Set(["a", "b"]));
            assert.equal(canSendChatChannel(state, c, "lovers"), false);
            state.roleMemory.b.lover = "c";
            assert.equal(canSendChatChannel(state, a, "lovers"), false, "one-way stale lover links must not grant access");
            assert.equal(normalizeChatChannel(undefined), "public");
            assert.throws(() => normalizeChatChannel("admin"), /聊天頻道無效/);
          });
          ''')

          replace_once("test/i18n-static.test.mjs",
            '  assert.equal(knownText("平票隨機淘汰 1 人", "en"), "Randomly eliminate 1 tied player");\n',
            '  assert.equal(knownText("平票隨機淘汰 1 人", "en"), "Randomly eliminate 1 tied player");\n  assert.equal(knownText("狼人私聊", "zh-CN"), "狼人私聊");\n  assert.equal(knownText("狼人私聊", "en"), "Werewolf chat");\n  assert.equal(knownText("情侶私聊", "zh-CN"), "情侣私聊");\n  assert.equal(knownText("情侶私聊", "en"), "Lovers chat");\n')
          replace_once("test/i18n-static.test.mjs",
            '  assert.match(app, /type: "chat", content, locale: getLocale\\(\\)/);\n',
            '  assert.match(html, /id="chatChannel"/);\n  assert.match(app, /type: "chat", content, locale: getLocale\\(\\), channel/);\n  assert.match(app, /const formElement = event\\.currentTarget/);\n  assert.match(app, /formElement\\.reset\\(\\)/);\n  assert.doesNotMatch(app, /event\\.currentTarget\\.reset\\(\\)/);\n')
          replace_once("test/i18n-static.test.mjs",
            '''test("room state preserves original player text plus source locale instead of persisted translated variants", () => {
  const types = readFileSync(new URL("../src/types.ts", import.meta.url), "utf8");
  const room = readFileSync(new URL("../src/room.ts", import.meta.url), "utf8");
  assert.match(types, /sourceLocale\\?: AppLocale/);
  assert.match(types, /type: "chat"; content: string; locale\\?: AppLocale/);
''',
            '''test("room state preserves original player text plus source locale instead of persisted translated variants", () => {
  const types = readFileSync(new URL("../src/types.ts", import.meta.url), "utf8");
  const room = readFileSync(new URL("../src/room.ts", import.meta.url), "utf8");
  assert.match(types, /sourceLocale\\?: AppLocale/);
  assert.match(types, /type: "chat"; content: string; locale\\?: AppLocale; channel\\?: ChatChannel/);
''')
          with Path("test/i18n-static.test.mjs").open("a") as f:
              f.write(r'''

          test("private chat visibility is enforced server-side and excluded from public AI context", () => {
            const types = readFileSync(new URL("../src/types.ts", import.meta.url), "utf8");
            const room = readFileSync(new URL("../src/room.ts", import.meta.url), "utf8");
            const chat = readFileSync(new URL("../src/chat.ts", import.meta.url), "utf8");
            assert.match(types, /export type ChatChannel = "public" \| "werewolf" \| "lovers"/);
