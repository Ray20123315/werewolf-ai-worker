name: bootstrap-project

on:
  push:
    paths:
      - '.bootstrap/ready'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reassemble verified project archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* | base64 --decode > /tmp/werewolf-bootstrap.tar.gz
          echo '9d0ec930f8f254645fbd1606554a898b7456735d50e3d26ee0645e5a986e7f6c  /tmp/werewolf-bootstrap.tar.gz' | sha256sum -c -
          tar -xzf /tmp/werewolf-bootstrap.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-project.yml
      - name: Commit complete project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Publish complete debate-mode Cloudflare Workers game'
          git push origin HEAD:main
