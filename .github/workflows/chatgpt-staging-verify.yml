name: chatgpt-staging-verify

on:
  push:
    branches: [chatgpt-auth-full-roles-v2]

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble verified source payload
        shell: bash
        run: |
          set -euo pipefail
          cat .chatgpt_staging_payload/part-*.bin > /tmp/auth_full_roles_payload.tar.xz
          echo "ae4ad349b6b34d4de855fa24720735a3bad2b0cfb5802d4754d64e88bcd0550e  /tmp/auth_full_roles_payload.tar.xz" | sha256sum -c -
          tar -xJf /tmp/auth_full_roles_payload.tar.xz
      - name: Verify exact source blob hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {
              "README.md": "1344590431f149da13f4557ece9a9207ba9ceeba",
              "SECURITY.md": "6eb54cf5e808b4068d5e4a3891eefdd9f7ef3368",
              "docs/ROLE_CATALOG.md": "9698e52a84f9da2592ddeb6731cadd3a79384f16",
              "src/roles.ts": "34c248aee66c1b2e3f463b086ab2a6bdcfb489a8",
              "src/types.ts": "2e46a03f29a791a35c10169306c3a293cbc5f6cb",
              "src/auth.ts": "63d6f7939c728663883ea58e72797aa03eb30489",
              "src/game-engine.ts": "6a1c85f196c80afd5c7a468365d50b2af188aaab",
              "src/room.ts": "80f608e89fdf4d9e697bf0a7e311de22e7d6d175",
              "src/index.ts": "e5a3841ea533bee87174cf801ee32690dc82b437",
              "public/index.html": "ab5403390b6110fa37d63f92742673f7d4b7f706",
              "public/app.js": "6e2db972db2ce2c6e96be40c5145f99c59ecd5c1",
              "public/styles.css": "ec8b62fa2aa93018faa21c9f4a2288cb437d7092",
              "test/game-engine.test.mjs": "a000bde84dffeb51cc8ac2fa1b81aaa952ddfda6",
              "tsconfig.test.json": "85ff4b155d9293a1d59d2e7a11cf9221afa2d6da",
              "wrangler.jsonc": "8a6f68ec453632da010a3b467ff6022d8bb1bd31",
          }
          for path, want in expected.items():
              data = Path(path).read_bytes()
              got = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
              if got != want:
                  raise SystemExit(f"blob mismatch {path}: {got} != {want}")
              print(f"OK {path} {got}")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
      - name: Re-verify and commit verified source only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {
              "README.md": "1344590431f149da13f4557ece9a9207ba9ceeba",
              "SECURITY.md": "6eb54cf5e808b4068d5e4a3891eefdd9f7ef3368",
              "docs/ROLE_CATALOG.md": "9698e52a84f9da2592ddeb6731cadd3a79384f16",
              "src/roles.ts": "34c248aee66c1b2e3f463b086ab2a6bdcfb489a8",
              "src/types.ts": "2e46a03f29a791a35c10169306c3a293cbc5f6cb",
              "src/auth.ts": "63d6f7939c728663883ea58e72797aa03eb30489",
              "src/game-engine.ts": "6a1c85f196c80afd5c7a468365d50b2af188aaab",
              "src/room.ts": "80f608e89fdf4d9e697bf0a7e311de22e7d6d175",
              "src/index.ts": "e5a3841ea533bee87174cf801ee32690dc82b437",
              "public/index.html": "ab5403390b6110fa37d63f92742673f7d4b7f706",
              "public/app.js": "6e2db972db2ce2c6e96be40c5145f99c59ecd5c1",
              "public/styles.css": "ec8b62fa2aa93018faa21c9f4a2288cb437d7092",
              "test/game-engine.test.mjs": "a000bde84dffeb51cc8ac2fa1b81aaa952ddfda6",
              "tsconfig.test.json": "85ff4b155d9293a1d59d2e7a11cf9221afa2d6da",
              "wrangler.jsonc": "8a6f68ec453632da010a3b467ff6022d8bb1bd31",
          }
          for path, want in expected.items():
              data = Path(path).read_bytes()
              got = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
              if got != want:
                  raise SystemExit(f"post-test blob mismatch {path}: {got} != {want}")
          PY
          rm -rf .chatgpt_staging_payload
          rm -f .github/workflows/chatgpt-staging-verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md SECURITY.md docs/ROLE_CATALOG.md src/roles.ts src/types.ts src/auth.ts src/game-engine.ts src/room.ts src/index.ts public/index.html public/app.js public/styles.css test/game-engine.test.mjs tsconfig.test.json wrangler.jsonc
          git add -A .chatgpt_staging_payload .github/workflows/chatgpt-staging-verify.yml
          git diff --cached --name-status
          git commit -m "Implement persistent auth and full debate role engine"
          git push origin HEAD:chatgpt-auth-full-roles-v2
